<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FuerteWaves · Canarias surf forecast</title>
  <meta name="description" content="Surf forecast for the Canary Islands: waves, swell, wind, tides, weather, satellite and live webcams.">
  <meta name="theme-color" content="#0B1F3A">
  <link rel="icon" href="assets/icon-512.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="./"><img src="assets/icon-512.png" alt="" width="32" height="32"><span>FuerteWaves</span></a>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="surf" class="on" data-i18n="nav_surf">Surf spots</button>
      <button role="tab" data-tab="ficha" class="tab-ficha" data-i18n="nav_ficha">Info</button>
      <button role="tab" data-tab="weather" data-i18n="nav_weather">Weather</button>
      <button role="tab" data-tab="cams" data-i18n="nav_webcams">Webcams</button>
    </nav>
    <nav class="sections" id="sections" aria-label="Sections"></nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" title="English" aria-label="English"><img src="assets/flags/en.svg" alt="EN"></button>
      <button data-lang="es" title="Español" aria-label="Español"><img src="assets/flags/es.svg" alt="ES"></button>
      <button data-lang="fr" title="Français" aria-label="Français"><img src="assets/flags/fr.svg" alt="FR"></button>
      <button data-lang="de" title="Deutsch" aria-label="Deutsch"><img src="assets/flags/de.svg" alt="DE"></button>
    </div>
  </header>

  <main class="layout">
    <section class="mapcol" aria-label="Map">
      <div id="spotmap"></div>
      <div class="chips islands" id="islands"></div>
      <select id="spotsel" aria-label="Spot"></select>
    </section>

    <section class="panel" id="panel">
      <div id="spothead"></div>

      <div class="tabpane" id="tab-surf"></div>

      <div class="tabpane" id="tab-ficha" hidden></div>

      <div class="tabpane" id="tab-weather" hidden>
        <h3 class="sectitle" data-i18n="nav_weather"></h3>
        <div id="wx"></div>
        <div class="chips" id="satchips"></div>
        <div id="satmap" aria-label="Satellite"></div>
        <p class="small muted" data-i18n="sat_credit"></p>
      </div>

      <div class="tabpane" id="tab-cams" hidden>
        <h3 class="sectitle" data-i18n="nav_webcams"></h3>
        <p class="sub" data-i18n="sec_cams_sub"></p>
        <div class="cams" id="cams"></div>
      </div>

      <footer class="foot">
        <p data-i18n="foot_sources"></p>
        <p data-i18n="foot_cams"></p>
        <p class="muted" data-i18n="foot_note"></p>
      </footer>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/data-canarias.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
